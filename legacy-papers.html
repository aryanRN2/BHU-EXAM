<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Legacy Semester Papers | SCIQB</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="styles.css"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "accent-bhu-saffron": "#F57C00",
                        "accent-neural-purple": "#A855F7",
                        "accent-neural-emerald": "#10B981",
                        "accent-neural-blue": "#3B82F6",
                        "background-warm": "#F7F7F5",
                        "primary": "#000000",
                        "secondary": "#5e5e5e",
                        "border-subtle": "#E7E7E4",
                        "on-background": "#1b1b1b"
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background-warm text-on-background antialiased selection:bg-accent-bhu-saffron/10 min-h-screen flex flex-col justify-between">

<!-- TopNavBar -->
<nav class="fixed top-0 left-0 right-0 z-50 bg-background-warm/80 backdrop-blur-xl border-b border-border-subtle shadow-sm h-16 md:h-20 w-full flex items-center">
    <div class="max-w-7xl mx-auto px-4 md:px-8 flex justify-between items-center w-full">
        <div class="flex items-center gap-3 md:gap-4">
            <button onclick="window.location.href='legacy-science.html'" class="w-8 h-8 md:w-10 md:h-10 rounded-full border border-border-subtle hover:bg-neutral-100 transition-all flex items-center justify-center text-secondary hover:text-primary shrink-0 mr-1 md:mr-2" title="Back to Departments">
                <span class="material-symbols-outlined text-base md:text-lg">arrow_back</span>
            </button>
            
            <span class="text-xl md:text-2xl font-black tracking-tight text-primary uppercase">SCIQB</span>
        </div>
    </div>
</nav>

<main class="relative pt-24 md:pt-40 pb-20 overflow-hidden flex-1 flex flex-col items-center">
    <!-- Background atmosphere -->
    <div class="neural-orb bg-accent-neural-emerald w-[500px] h-[500px] -top-20 -left-10 opacity-20 animate-float"></div>
    <div class="neural-orb bg-accent-bhu-saffron w-[400px] h-[400px] bottom-10 -right-10 opacity-20 animate-float" style="animation-delay: -3s;"></div>

    <div class="max-w-5xl w-full mx-auto px-4 md:px-8 relative z-10 flex flex-col items-center">
        <!-- Header -->
        <div class="text-center mb-8">
            <span class="bg-accent-neural-emerald/10 text-accent-neural-emerald px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider" id="deptBadge">Department</span>
            <h1 class="text-3xl md:text-5xl font-bold text-primary tracking-tight mt-4" id="deptTitle">Syllabus Papers</h1>
            <p class="text-sm md:text-base text-secondary max-w-xl mt-3 leading-relaxed">View question papers organized by semester. Launch AI evaluation, pattern analysis, or download PDFs.</p>
        </div>

        <!-- Search Bar -->
        <div class="w-full max-w-xl mb-10 relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary">search</span>
            <input type="text" id="paperSearchInput" placeholder="Search papers by year, title, or course..." 
                   class="w-full pl-12 pr-10 py-3.5 bg-white/50 backdrop-blur-md border border-border-subtle rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-accent-bhu-saffron/20 focus:border-accent-bhu-saffron transition-all text-primary"
                   oninput="filterPapers()"/>
            <button onclick="clearSearch()" id="clearSearchBtn" class="absolute right-4 top-1/2 -translate-y-1/2 text-secondary hover:text-primary hidden">
                <span class="material-symbols-outlined text-lg">close</span>
            </button>
        </div>

        <!-- Semesters Container -->
        <div id="semestersContainer" class="w-full space-y-8">
            <!-- Dynamic Semester groups will load here -->
            <div class="flex justify-center py-20" id="loader">
                <div class="w-10 h-10 border-4 border-accent-bhu-saffron border-t-transparent rounded-full animate-spin"></div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="w-full py-12 bg-background-warm border-t border-border-subtle">
    <div class="max-w-7xl mx-auto px-4 md:px-8 flex flex-col md:flex-row justify-between items-center gap-8">
        <div>
            <span class="text-xs font-semibold tracking-wider text-primary mb-2 block uppercase">Banaras Hindu University</span>
            <p class="text-xs text-secondary">© 2026 Banaras Hindu University. Prepared under legacy academic syllabus archive.</p>
        </div>
    </div>
</footer>

<script type="module">
    import { LEGACY_PYQ_DATA } from './js/legacy-data.js?v=6';

    const params = new URLSearchParams(window.location.search);
    const deptKey = params.get('dept') || 'maths';

    const deptLabels = {
        'maths': 'Mathematics',
        'physics': 'Physics',
        'chemistry': 'Chemistry',
        'geography': 'Geography',
        'geology': 'Geology',
        'statistics': 'Statistics',
        'computerscience': 'Computer Science',
        'zoology': 'Zoology',
        'botany': 'Botany'
    };

    const deptBadgeLabel = deptLabels[deptKey] || 'Science';
    document.getElementById('deptBadge').textContent = deptBadgeLabel;
    document.getElementById('deptTitle').textContent = `${deptBadgeLabel} PYQs`;

    let activePapers = LEGACY_PYQ_DATA[deptKey] || [];

    // Group papers by semester (1 to 6)
    function groupPapersBySemester(papers) {
        const groups = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
        papers.forEach(p => {
            const sem = p.semester || 1;
            if (groups[sem]) {
                groups[sem].push(p);
            } else {
                groups[1].push(p); // default fallback
            }
        });
        return groups;
    }

    function renderSemesterPapers(papersToRender) {
        const container = document.getElementById('semestersContainer');
        container.innerHTML = '';

        const loader = document.getElementById('loader');
        if (loader) loader.classList.add('hidden');

        const grouped = groupPapersBySemester(papersToRender);
        let hasAnyPaper = false;

        const semRoman = {
            1: 'Semester I',
            2: 'Semester II',
            3: 'Semester III',
            4: 'Semester IV',
            5: 'Semester V',
            6: 'Semester VI'
        };

        for (let semNum = 1; semNum <= 6; semNum++) {
            const papersList = grouped[semNum];
            if (papersList.length === 0) continue;
            hasAnyPaper = true;

            let papersMarkup = '';
            papersList.forEach(p => {
                const fileUrl = encodeURIComponent(p.url);
                const titleParam = encodeURIComponent(p.title);
                
                papersMarkup += `
                    <div class="glass-card p-5 rounded-xl border border-border-subtle flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 hover:shadow-sm transition-all">
                        <div class="flex items-start gap-4">
                            <div class="w-10 h-10 rounded-lg bg-red-50 flex items-center justify-center text-red-600 shrink-0">
                                <span class="material-symbols-outlined text-2xl">picture_as_pdf</span>
                            </div>
                            <div>
                                <h4 class="font-bold text-sm text-primary leading-tight">${p.title}</h4>
                                <p class="text-[10px] text-secondary mt-1">Official BHU legacy curriculum paper • PDF format</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2.5 w-full sm:w-auto shrink-0">
                            <a href="${p.url}" target="_blank" rel="noopener" class="flex-grow sm:flex-grow-0 bg-primary text-white hover:bg-neutral-800 px-4 py-2 rounded-full font-bold text-xs flex items-center justify-center gap-1.5 transition-all duration-200 active:scale-95">
                                <span class="material-symbols-outlined text-sm">picture_as_pdf</span>
                                <span>View Paper</span>
                            </a>
                        </div>
                    </div>
                `;
            });

            const semesterHTML = `
                <div class="border border-border-subtle bg-white/40 backdrop-blur-md rounded-2xl p-6 md:p-8 space-y-4">
                    <div class="flex items-center justify-between border-b border-border-subtle/50 pb-3">
                        <div class="flex items-center gap-3">
                            <span class="w-2.5 h-2.5 rounded-full bg-accent-bhu-saffron"></span>
                            <h2 class="font-bold text-lg md:text-xl text-primary">${semRoman[semNum]}</h2>
                        </div>
                        <span class="bg-primary/5 text-secondary text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">${papersList.length} Papers</span>
                    </div>
                    <div class="space-y-4">
                        ${papersMarkup}
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', semesterHTML);
        }

        if (!hasAnyPaper) {
            container.innerHTML = `
                <div class="glass-panel p-12 text-center border border-border-subtle rounded-xl text-secondary w-full">
                    <span class="material-symbols-outlined text-4xl mb-3 text-secondary">search_off</span>
                    <p class="text-sm font-semibold">No syllabus question papers found matching your search.</p>
                </div>
            `;
        }
    }

    // Initial load
    renderSemesterPapers(activePapers);

    window.filterPapers = function() {
        const query = document.getElementById('paperSearchInput').value.toLowerCase().trim();
        const clearBtn = document.getElementById('clearSearchBtn');
        
        if (query) {
            clearBtn.classList.remove('hidden');
        } else {
            clearBtn.classList.add('hidden');
        }

        const filtered = activePapers.filter(p => {
            const title = p.title.toLowerCase();
            return title.includes(query);
        });
        
        renderSemesterPapers(filtered);
    };

    window.clearSearch = function() {
        const input = document.getElementById('paperSearchInput');
        input.value = '';
        filterPapers();
    };


</script>

</body>
</html>
