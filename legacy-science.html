<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Science Departments | BHU Exam Prep</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="styles.css"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "accent-bhu-saffron": "#F57C00",
                        "accent-neural-purple": "#A855F7",
                        "accent-neural-emerald": "#10B981",
                        "accent-neural-blue": "#3B82F6",
                        "background-warm": "#F7F7F5",
                        "primary": "#000000",
                        "secondary": "#5e5e5e",
                        "border-subtle": "#E7E7E4",
                        "on-background": "#1b1b1b"
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background-warm text-on-background antialiased selection:bg-accent-bhu-saffron/10 min-h-screen flex flex-col justify-between">

<!-- TopNavBar -->
<nav class="fixed top-0 left-0 right-0 z-50 bg-background-warm/80 backdrop-blur-xl border-b border-border-subtle shadow-sm h-16 md:h-20 w-full flex items-center">
    <div class="max-w-7xl mx-auto px-4 md:px-8 flex justify-between items-center w-full">
        <div class="flex items-center gap-3 md:gap-4">
            <button onclick="window.location.href='legacy-pyq.html'" class="w-8 h-8 md:w-10 md:h-10 rounded-full border border-border-subtle hover:bg-neutral-100 transition-all flex items-center justify-center text-secondary hover:text-primary shrink-0 mr-1 md:mr-2" title="Back to Streams">
                <span class="material-symbols-outlined text-base md:text-lg">arrow_back</span>
            </button>
            
            <span class="text-sm md:text-2xl font-bold tracking-tighter text-primary">BHU Exam Prep</span>
        </div>
    </div>
</nav>

<main class="relative pt-24 md:pt-40 pb-20 overflow-hidden flex-1 flex flex-col items-center justify-center">
    <!-- Background atmosphere -->
    <div class="neural-orb bg-accent-neural-purple w-[500px] h-[500px] -top-20 -left-10 opacity-20 animate-float"></div>
    <div class="neural-orb bg-accent-bhu-saffron w-[400px] h-[400px] bottom-10 -right-10 opacity-20 animate-float" style="animation-delay: -3s;"></div>

    <div class="max-w-7xl w-full mx-auto px-4 md:px-8 relative z-10 flex flex-col items-center">
        <!-- Header -->
        <div class="text-center mb-12">
            <span class="bg-accent-bhu-saffron/15 text-accent-bhu-saffron px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider">Science Division</span>
            <h1 class="text-3xl md:text-5xl font-bold text-primary tracking-tight mt-4">Select Department</h1>
            <p class="text-sm md:text-base text-secondary max-w-xl mt-3 leading-relaxed">Pick a science department below to view its previous year exam papers organized semester-wise.</p>
        </div>

        <!-- Department Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 max-w-5xl w-full">
            
            <!-- Mathematics -->
            <button onclick="window.location.href='legacy-papers.html?dept=maths'" class="p-5 md:p-6 rounded-xl border border-border-subtle bg-white/60 backdrop-blur-md hover:border-accent-bhu-saffron hover:bg-white transition-all duration-300 text-left flex items-center gap-5 group shadow-sm hover:shadow-md hover:scale-[1.01] active:scale-[0.99]">
                <div class="w-12 h-12 rounded-lg bg-accent-bhu-saffron/10 flex items-center justify-center text-accent-bhu-saffron group-hover:bg-accent-bhu-saffron group-hover:text-white transition-all duration-300 shrink-0">
                    <span class="material-symbols-outlined text-2xl">calculate</span>
                </div>
                <div>
                    <h3 class="font-bold text-base text-primary group-hover:text-accent-bhu-saffron transition-colors">Mathematics</h3>
                    <p class="text-[11px] text-secondary mt-0.5">Calculus, Algebra, Real Analysis, Geometry...</p>
                </div>
            </button>

            <!-- Physics -->
            <button onclick="window.location.href='legacy-papers.html?dept=physics'" class="p-5 md:p-6 rounded-xl border border-border-subtle bg-white/60 backdrop-blur-md hover:border-accent-neural-purple hover:bg-white transition-all duration-300 text-left flex items-center gap-5 group shadow-sm hover:shadow-md hover:scale-[1.01] active:scale-[0.99]">
                <div class="w-12 h-12 rounded-lg bg-accent-neural-purple/10 flex items-center justify-center text-accent-neural-purple group-hover:bg-accent-neural-purple group-hover:text-white transition-all duration-300 shrink-0">
                    <span class="material-symbols-outlined text-2xl">insights</span>
                </div>
                <div>
                    <h3 class="font-bold text-base text-primary group-hover:text-accent-neural-purple transition-colors">Physics</h3>
                    <p class="text-[11px] text-secondary mt-0.5">Electromagnetic Theory, Mechanics, Optics...</p>
                </div>
            </button>

            <!-- Chemistry -->
            <button onclick="window.location.href='legacy-papers.html?dept=chemistry'" class="p-5 md:p-6 rounded-xl border border-border-subtle bg-white/60 backdrop-blur-md hover:border-accent-neural-blue hover:bg-white transition-all duration-300 text-left flex items-center gap-5 group shadow-sm hover:shadow-md hover:scale-[1.01] active:scale-[0.99]">
                <div class="w-12 h-12 rounded-lg bg-accent-neural-blue/10 flex items-center justify-center text-accent-neural-blue group-hover:bg-accent-neural-blue group-hover:text-white transition-all duration-300 shrink-0">
                    <span class="material-symbols-outlined text-2xl">science</span>
                </div>
                <div>
                    <h3 class="font-bold text-base text-primary group-hover:text-accent-neural-blue transition-colors">Chemistry</h3>
                    <p class="text-[11px] text-secondary mt-0.5">Organic, Inorganic, Physical Chemistry...</p>
                </div>
            </button>

            <!-- Geography -->
            <button onclick="window.location.href='legacy-papers.html?dept=geography'" class="p-5 md:p-6 rounded-xl border border-border-subtle bg-white/60 backdrop-blur-md hover:border-accent-neural-emerald hover:bg-white transition-all duration-300 text-left flex items-center gap-5 group shadow-sm hover:shadow-md hover:scale-[1.01] active:scale-[0.99]">
                <div class="w-12 h-12 rounded-lg bg-accent-neural-emerald/10 flex items-center justify-center text-accent-neural-emerald group-hover:bg-accent-neural-emerald group-hover:text-white transition-all duration-300 shrink-0">
                    <span class="material-symbols-outlined text-2xl">public</span>
                </div>
                <div>
                    <h3 class="font-bold text-base text-primary group-hover:text-accent-neural-emerald transition-colors">Geography</h3>
                    <p class="text-[11px] text-secondary mt-0.5">Geomorphology, Climatology, Human Geography...</p>
                </div>
            </button>

            <!-- Geology -->
            <button onclick="window.location.href='legacy-papers.html?dept=geology'" class="p-5 md:p-6 rounded-xl border border-border-subtle bg-white/60 backdrop-blur-md hover:border-amber-600 hover:bg-white transition-all duration-300 text-left flex items-center gap-5 group shadow-sm hover:shadow-md hover:scale-[1.01] active:scale-[0.99]">
                <div class="w-12 h-12 rounded-lg bg-amber-600/10 flex items-center justify-center text-amber-600 group-hover:bg-amber-600 group-hover:text-white transition-all duration-300 shrink-0">
                    <span class="material-symbols-outlined text-2xl">terrain</span>
                </div>
                <div>
                    <h3 class="font-bold text-base text-primary group-hover:text-amber-600 transition-colors">Geology</h3>
                    <p class="text-[11px] text-secondary mt-0.5">Palaeontology, Petrology, Mineralogy, Stratigraphy...</p>
                </div>
            </button>

            <!-- Statistics -->
            <button onclick="window.location.href='legacy-papers.html?dept=statistics'" class="p-5 md:p-6 rounded-xl border border-border-subtle bg-white/60 backdrop-blur-md hover:border-accent-neural-blue hover:bg-white transition-all duration-300 text-left flex items-center gap-5 group shadow-sm hover:shadow-md hover:scale-[1.01] active:scale-[0.99]">
                <div class="w-12 h-12 rounded-lg bg-accent-neural-blue/10 flex items-center justify-center text-accent-neural-blue group-hover:bg-accent-neural-blue group-hover:text-white transition-all duration-300 shrink-0">
                    <span class="material-symbols-outlined text-2xl">bar_chart</span>
                </div>
                <div>
                    <h3 class="font-bold text-base text-primary group-hover:text-accent-neural-blue transition-colors">Statistics</h3>
                    <p class="text-[11px] text-secondary mt-0.5">Statistical Inference, Sample Surveys, Probability...</p>
                </div>
            </button>

            <!-- Computer Science -->
            <button onclick="window.location.href='legacy-papers.html?dept=computerscience'" class="p-5 md:p-6 rounded-xl border border-border-subtle bg-white/60 backdrop-blur-md hover:border-accent-neural-purple hover:bg-white transition-all duration-300 text-left flex items-center gap-5 group shadow-sm hover:shadow-md hover:scale-[1.01] active:scale-[0.99]">
                <div class="w-12 h-12 rounded-lg bg-accent-neural-purple/10 flex items-center justify-center text-accent-neural-purple group-hover:bg-accent-neural-purple group-hover:text-white transition-all duration-300 shrink-0">
                    <span class="material-symbols-outlined text-2xl">terminal</span>
                </div>
                <div>
                    <h3 class="font-bold text-base text-primary group-hover:text-accent-neural-purple transition-colors">Computer Science</h3>
                    <p class="text-[11px] text-secondary mt-0.5">C Programming, Data Structures, Algorithms, Networks...</p>
                </div>
            </button>

            <!-- Zoology -->
            <button onclick="window.location.href='legacy-papers.html?dept=zoology'" class="p-5 md:p-6 rounded-xl border border-border-subtle bg-white/60 backdrop-blur-md hover:border-red-500 hover:bg-white transition-all duration-300 text-left flex items-center gap-5 group shadow-sm hover:shadow-md hover:scale-[1.01] active:scale-[0.99]">
                <div class="w-12 h-12 rounded-lg bg-red-500/10 flex items-center justify-center text-red-500 group-hover:bg-red-500 group-hover:text-white transition-all duration-300 shrink-0">
                    <span class="material-symbols-outlined text-2xl">pets</span>
                </div>
                <div>
                    <h3 class="font-bold text-base text-primary group-hover:text-red-500 transition-colors">Zoology</h3>
                    <p class="text-[11px] text-secondary mt-0.5">Animal Physiology, Genetics, Cell Biology, Ecology...</p>
                </div>
            </button>

            <!-- Botany -->
            <button onclick="window.location.href='legacy-papers.html?dept=botany'" class="p-5 md:p-6 rounded-xl border border-border-subtle bg-white/60 backdrop-blur-md hover:border-accent-neural-emerald hover:bg-white transition-all duration-300 text-left flex items-center gap-5 group shadow-sm hover:shadow-md hover:scale-[1.01] active:scale-[0.99]">
                <div class="w-12 h-12 rounded-lg bg-accent-neural-emerald/10 flex items-center justify-center text-accent-neural-emerald group-hover:bg-accent-neural-emerald group-hover:text-white transition-all duration-300 shrink-0">
                    <span class="material-symbols-outlined text-2xl">eco</span>
                </div>
                <div>
                    <h3 class="font-bold text-base text-primary group-hover:text-accent-neural-emerald transition-colors">Botany</h3>
                    <p class="text-[11px] text-secondary mt-0.5">Plant Ecology, Physiology, Algae, Fungi, Genetics...</p>
                </div>
            </button>

        </div>
    </div>
</main>

<!-- Footer -->
<footer class="w-full py-12 bg-background-warm border-t border-border-subtle">
    <div class="max-w-7xl mx-auto px-4 md:px-8 flex flex-col md:flex-row justify-between items-center gap-8">
        <div>
            <span class="text-xs font-semibold tracking-wider text-primary mb-2 block uppercase">Banaras Hindu University</span>
            <p class="text-xs text-secondary">© 2026 Banaras Hindu University. Prepared under legacy academic syllabus archive.</p>
        </div>
    </div>
</footer>

</body>
</html>
